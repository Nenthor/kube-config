apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: csp-header
  namespace: dependency-track
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  headers:
    contentSecurityPolicy: "default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https: wss:; font-src 'self' data:; manifest-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;"
