# yaml-language-server: $schema=https://github.com/DependencyTrack/helm-charts/raw/refs/heads/main/charts/dependency-track/values.schema.json

database:
  jdbcUrl: 'jdbc:postgresql://postgres-rw.cnpg-database.svc.cluster.local:5432/dependency-track?reWriteBatchedInserts=true'
  existingSecret:
    name: dependency-track-db-credentials
    usernameKey: username
    passwordKey: password

secretManagement:
  provider: database
  database:
    kek:
      mode: config
      existingSecret:
        name: dependency-track-kek
        key: kek

fileStorage:
  provider: local
  local:
    size: 8Gi
    storageClassName: local-path

apiServer:
  topology: monolith

  web:
    replicaCount: 1
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        memory: 2Gi

frontend:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

ingress:
  enabled: false
