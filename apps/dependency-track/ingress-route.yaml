apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dependency-track-ingress
  namespace: dependency-track
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  entryPoints:
    - ws-home
  routes:
    - kind: Rule
      match: Host(`dependencies.home.nentwich.dev`) && PathPrefix(`/api`)
      middlewares:
        - name: csp-header
      services:
        - name: dependency-track-api-server
          port: 8080

    - kind: Rule
      match: Host(`dependencies.home.nentwich.dev`)
      middlewares:
        - name: csp-header
      services:
        - name: dependency-track-frontend
          port: 8080

  tls: {}
