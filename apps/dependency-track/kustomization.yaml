apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: dependency-track
    repo: oci://ghcr.io/dependencytrack/helm-charts
    version: 2.8.0
    releaseName: dependency-track
    namespace: dependency-track
    valuesFile: values.yaml

resources:
  - db-secret.yaml
  - kek-secret.yaml
  - ingress-route-middleware.yaml
  - ingress-route.yaml
