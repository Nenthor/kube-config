apiVersion: apps/v1
kind: Deployment
metadata:
  name: stirling-pdf-app
  namespace: stirling-pdf
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stirling-pdf-app
  template:
    metadata:
      labels:
        app: stirling-pdf-app
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
      containers:
        - name: stirling-pdf-container
          image: stirlingtools/stirling-pdf:2.14.3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
              add: ['CHOWN', 'SETUID', 'SETGID']
          ports:
            - containerPort: 8080
          env:
            - name: SECURITY_ENABLELOGIN
              value: 'false'
            - name: SYSTEM_DEFAULTLOCALE
              value: 'de-DE'
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: '2'
              memory: 2Gi
          volumeMounts:
            - mountPath: /configs
              name: stirling-pdf-data
            - mountPath: /tmp
              name: stirling-pdf-tmp
            - mountPath: /home/stirlingpdfuser
              name: stirling-pdf-home
      volumes:
        - name: stirling-pdf-data
          persistentVolumeClaim:
            claimName: stirling-pdf-pvc
        - name: stirling-pdf-tmp
          emptyDir: {}
        - name: stirling-pdf-home
          emptyDir: {}
