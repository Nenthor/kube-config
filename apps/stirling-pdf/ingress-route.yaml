apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: stirling-pdf-route
  namespace: stirling-pdf
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  entryPoints:
    - ws-home
  routes:
    - kind: Rule
      match: Host(`pdf.home.nentwich.dev`)
      services:
        - name: stirling-pdf-service
          port: 80
  tls: {}
