apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vaultwarden-route
  namespace: vaultwarden
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`vaultwarden.home.nentwich.dev`)
      services:
        - name: vaultwarden-service
          port: 80
  tls: {}
