apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: test-route
  namespace: runner-test
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`test.home.nentwich.dev`)
      priority: 10
      services:
        - name: test-service
          port: 80

  tls: {}
