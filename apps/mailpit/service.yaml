apiVersion: v1
kind: Service
metadata:
  name: mailpit-service
  namespace: mailpit
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  selector:
    app: mailpit-app
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8025
    - name: smtp
      protocol: TCP
      port: 1025
      targetPort: 1025
