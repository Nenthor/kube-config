apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mailpit-smtp-ingress
  namespace: mailpit
spec:
  podSelector:
    matchLabels:
      app: mailpit-app
  policyTypes:
    - Ingress
  ingress:
    # Only ghost can send mails
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ghost
      ports:
        - protocol: TCP
          port: 1025
    - ports:
        - protocol: TCP
          port: 8025
