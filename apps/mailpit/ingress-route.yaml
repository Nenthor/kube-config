apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mailpit-route
  namespace: mailpit
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  entryPoints:
    - ws-home
  routes:
    - kind: Rule
      match: Host(`mailpit.home.nentwich.dev`)
      services:
        - name: mailpit-service
          port: 80
  tls: {}
