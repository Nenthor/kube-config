apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: mariadb
spec:
  image: mariadb:10.11.18
  replicas: 1

  rootPasswordSecretKeyRef:
    generate: false
    name: seafile-secret
    key: INIT_SEAFILE_MYSQL_ROOT_PASSWORD

  # Replaces MARIADB_USER / MARIADB_PASSWORD / MARIADB_DATABASE
  username: seafile
  passwordSecretKeyRef:
    generate: false
    name: seafile-secret
    key: SEAFILE_MYSQL_DB_PASSWORD
  database: seafile_db

  storage:
    size: 10Gi

  volumes:
    - name: run-socket
      emptyDir: {}
    - name: tmp
      emptyDir: {}
  volumeMounts:
    - name: run-socket
      mountPath: /run/mysqld
    - name: tmp
      mountPath: /tmp

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ['ALL']
