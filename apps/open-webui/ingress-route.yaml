apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: open-webui-ingress
  namespace: open-webui
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  entryPoints:
    - ws-nentwich
  routes:
    - kind: Rule
      match: Host(`chat.home.nentwich.dev`)
      services:
        - name: open-webui
          port: 80

  tls: {}
