# https://raw.githubusercontent.com/open-webui/helm-charts/refs/heads/main/charts/open-webui/values.yaml

ollama:
  enabled: false

ollamaUrls:
  - http://ollama.home.nentwich.dev:11434

pipelines:
  enabled: false

tika:
  enabled: true
  image:
    repository: apache/tika
    tag: 3.3.3.0-full@sha256:6ef30abd65df4b6c478907904099d0245bdb0e0686f94fb9bc7493558442bb74
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 2Gi

persistence:
  enabled: true
  size: 16Gi

resources:
  requests:
    cpu: 200m
    memory: 800Mi
  limits:
    cpu: 1000m
    memory: 1200Mi

extraEnvVars:
  # Avoids loading the local sentence-transformers embedding model into memory
  - name: RAG_EMBEDDING_ENGINE
    value: 'ollama'
  # Avoids loading the local Whisper speech-to-text model into memory
  - name: AUDIO_STT_ENGINE
    value: 'webapi'
  # Web search
  - name: ENABLE_WEB_SEARCH
    value: 'True'
  - name: WEB_SEARCH_ENGINE
    value: 'searxng'
  - name: SEARXNG_QUERY_URL
    value: 'http://searxng-service.searxng.svc.cluster.local/search?q=<query>'
  - name: WEB_SEARCH_RESULT_COUNT
    value: '3'
  - name: WEB_SEARCH_CONCURRENT_REQUESTS
    value: '10'

  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: open-webui-db-secret
        key: DATABASE_URL
