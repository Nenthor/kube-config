# https://raw.githubusercontent.com/open-webui/helm-charts/refs/heads/main/charts/open-webui/values.yaml

ollama:
  enabled: false

ollamaUrls:
  - http://ollama.home.nentwich.dev:11434

pipelines:
  enabled: false

tika:
  enabled: true
  image:
    repository: apache/tika
    tag: 3.4.0.0-full@sha256:33d96e4c936b4bc716e9ca310a2e8d93f609be55571e9f777ae247e85462306f
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 2Gi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 35002
    runAsGroup: 35002
    fsGroup: 35002
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false

websocket:
  redis:
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 999
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ['ALL']

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ['ALL']

persistence:
  enabled: true
  size: 16Gi

resources:
  requests:
    cpu: 200m
    memory: 800Mi
  limits:
    cpu: 1000m
    memory: 1200Mi

extraEnvVars:
  # Avoids loading the local sentence-transformers embedding model into memory
  - name: RAG_EMBEDDING_ENGINE
    value: 'ollama'
  # Avoids loading the local Whisper speech-to-text model into memory
  - name: AUDIO_STT_ENGINE
    value: 'webapi'
  # Web search
  - name: ENABLE_WEB_SEARCH
    value: 'True'
  - name: WEB_SEARCH_ENGINE
    value: 'searxng'
  - name: SEARXNG_QUERY_URL
    value: 'http://searxng-service.searxng.svc.cluster.local/search?q=<query>'
  - name: WEB_SEARCH_RESULT_COUNT
    value: '3'
  - name: WEB_SEARCH_CONCURRENT_REQUESTS
    value: '10'

  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: open-webui-db-secret
        key: DATABASE_URL
