apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: ce
    repo: https://haiwen.github.io/seafile-helm-chart/repo
    version: 13.0.4
    releaseName: seafile
    namespace: seafile
    valuesFile: values.yaml

resources:
  - secrets.yaml
  - mariadb.yaml
  - redis.yaml
  - ingress-route.yaml

images:
  - name: seafileltd/seafile-mc
    newTag: 13.0.28
  - name: redis
    newTag: 8.10.2-alpine
  - name: mariadb
    newTag: 10.11.18
