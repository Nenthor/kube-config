apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app
  namespace: test-deployment
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-app
  template:
    metadata:
      labels:
        app: test-app
    spec:
      imagePullSecrets:
        - name: forgejo-registry-secret
      containers:
        - name: test-container
          image: git.nentwich.dev/nentwich/runner-test:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: 32Mi
              cpu: 1m
            limits:
              cpu: 10m
              memory: 128Mi
