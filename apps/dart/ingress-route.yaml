apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dart-route
  namespace: dart
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`dart.nentwich.dev`)
      services:
        - name: dart-service
          port: 80
          middlewares:
            - name: csp-header

  tls: {}

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: csp-header
  namespace: dart
spec:
  headers:
    contentSecurityPolicy: "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https: wss:; font-src 'self' data:; manifest-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;"
