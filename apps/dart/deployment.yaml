apiVersion: apps/v1
kind: Deployment
metadata:
  name: dart-app
  namespace: dart
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dart-app
  template:
    metadata:
      labels:
        app: dart-app
    spec:
      containers:
        - name: dart-container
          image: git.nentwich.dev/nentwich/dart:1.0.0
          ports:
            - containerPort: 80
          env:
            - name: PORT
              value: '80'
          envFrom:
            - secretRef:
                name: dart-credentials
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
