apiVersion: apps/v1
kind: Deployment
metadata:
  name: dart-app
  namespace: dart
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dart-app
  template:
    metadata:
      labels:
        app: dart-app
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dart-container
          image: git.nentwich.dev/nentwich/dart:1.0.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
              add: ['NET_BIND_SERVICE', 'CHOWN']
          ports:
            - containerPort: 80
          env:
            - name: PORT
              value: '80'
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
