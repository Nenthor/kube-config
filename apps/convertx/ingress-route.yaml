apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: convertx-route
  namespace: convertx
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  entryPoints:
    - ws-home
  routes:
    - kind: Rule
      match: Host(`convert.home.nentwich.dev`)
      services:
        - name: convertx-service
          port: 80
  tls: {}
