apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: forgejo

helmCharts:
  - name: forgejo
    repo: oci://code.forgejo.org/forgejo-helm
    version: 17.1.0
    releaseName: forgejo
    namespace: forgejo
    valuesFile: values-forgejo.yaml

  - name: forgejo-runner
    repo: oci://codeberg.org/wrenix/helm-charts
    version: 0.7.6
    releaseName: forgejo-runner
    namespace: forgejo
    valuesFile: values-forgejo-runner.yaml

resources:
  - db-secret.yaml
  - runner-secret.yaml
