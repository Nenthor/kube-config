# https://code.forgejo.org/forgejo-helm/forgejo-runner/src/branch/main/values.yaml

knownLastVersion: true

runner:
  config:
    create: false

dind:
  resources:
    requests:
      cpu: '100m'
      memory: '128Mi'
    limits:
      cpu: '2000m'
      memory: '2Gi'

securityContext:
  privileged: true
  runAsNonRoot: false

resources:
  requests:
    cpu: '100m'
    memory: '128Mi'
  limits:
    cpu: '1000m'
    memory: '1024Mi'

volumes:
  - name: runner-cache
    persistentVolumeClaim:
      claimName: forgejo-runner-cache-pvc
  - name: runner-config
    secret:
      secretName: forgejo-runner-secret
      items:
        - key: config.yaml
          path: config.yaml

volumeMounts:
  - name: runner-cache
    mountPath: /data/.cache
  - name: runner-config
    mountPath: /config
