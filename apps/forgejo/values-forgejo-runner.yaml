# https://code.forgejo.org/forgejo-helm/forgejo-runner/src/branch/main/values.yaml

knownLastVersion: true

image:
  registry: code.forgejo.org
  repository: forgejo/runner
  tag: 13.2.0

runner:
  config:
    create: true
    existingInitSecret: 'forgejo-runner-init-secret'

    file:
      log:
        level: info

      runner:
        capacity: 5
        envs:
          A_TEST_ENV_NAME_1: null
          A_TEST_ENV_NAME_2: null
          DOCKER_HOST: tcp://docker:2376
          DOCKER_TLS_VERIFY: 1
          DOCKER_CERT_PATH: /certs/client
        labels:
          - 'ubuntu-latest:docker://git.nentwich.dev/nentwich/runner:sha-e43e473'

      container:
        network: bridge
        privileged: false
        options: '-v /certs/client:/certs/client --add-host=docker:host-gateway'
        valid_volumes:
          - '/certs/client'

      cache:
        enabled: true
        dir: '/data/.cache/actcache'

dind:
  resources:
    requests:
      cpu: '100m'
      memory: '128Mi'
    limits:
      cpu: '2000m'
      memory: '2Gi'

securityContext:
  privileged: true
  runAsNonRoot: false

resources:
  requests:
    cpu: '100m'
    memory: '128Mi'
  limits:
    cpu: '1000m'
    memory: '1024Mi'

volumes:
  - name: runner-cache
    persistentVolumeClaim:
      claimName: forgejo-runner-cache-pvc
  - name: dind-daemon-config
    configMap:
      name: forgejo-dind-daemon-config

volumeMounts:
  # Set pull-trough proxy
  - name: dind-daemon-config
    mountPath: /etc/docker/daemon.json
    subPath: daemon.json
    readOnly: true
