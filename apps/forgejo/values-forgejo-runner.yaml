# https://code.forgejo.org/forgejo-helm/forgejo-runner/src/branch/main/values.yaml

knownLastVersion: true

runner:
  config:
    existingSecret: 'forgejo-runner-secret'

dind:
  resources:
    requests:
      cpu: '100m'
      memory: '128Mi'
    limits:
      cpu: '2000m'
      memory: '2Gi'

securityContext:
  privileged: true
  runAsNonRoot: false

resources:
  requests:
    cpu: '100m'
    memory: '128Mi'
  limits:
    cpu: '1000m'
    memory: '1024Mi'

volumes:
  - name: runner-cache
    persistentVolumeClaim:
      claimName: forgejo-runner-cache-pvc

volumeMounts:
  - name: runner-cache
    mountPath: /data/.cache
