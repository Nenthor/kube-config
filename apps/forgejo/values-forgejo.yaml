# yaml-language-server: $schema=https://code.forgejo.org/forgejo-helm/forgejo-helm/raw/branch/main/values.schema.json

global:
  storageClass: 'local-path'

podSecurityContext:
  fsGroup: 1001

containerSecurityContext:
  runAsUser: 1001
  runAsGroup: 1001
  readOnlyRootFilesystem: true

service:
  http:
    type: ClusterIP
    port: 3000
  ssh:
    type: LoadBalancer
    port: 22
    annotations:
      metallb.universe.tf/loadBalancerIPs: '10.77.20.201'

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: git.home.nentwich.dev
      paths:
        - path: /
          pathType: Prefix
          port: http
  tls: []

persistence:
  enabled: true
  create: true
  mount: true
  claimName: forgejo-data-pvc
  size: 16Gi

gitea:
  config:
    APP_NAME: 'Forgejo'

    database:
      DB_TYPE: postgres
      HOST: postgres-rw.cnpg-database.svc.cluster.local:5432
      NAME: forgejo

    server:
      ROOT_URL: 'https://git.home.nentwich.dev'
      SSH_DOMAIN: 'git.home.nentwich.dev'
      SSH_PORT: 22
      SSH_LISTEN_PORT: 2222

    actions:
      ENABLED: 'true'

  additionalConfigFromEnvs:
    - name: FORGEJO__DATABASE__USER
      valueFrom:
        secretKeyRef:
          name: forgejo-db-credentials
          key: username
    - name: FORGEJO__DATABASE__PASSWD
      valueFrom:
        secretKeyRef:
          name: forgejo-db-credentials
          key: password
