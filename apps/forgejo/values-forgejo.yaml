# yaml-language-server: $schema=https://code.forgejo.org/forgejo-helm/forgejo-helm/raw/branch/main/values.schema.json

global:
  storageClass: 'local-path'

image:
  registry: code.forgejo.org
  repository: forgejo/forgejo
  tag: 17.0.1@sha256:fcd19ff4ebc85fb098a67e8e1d0d5a84d07dd6e8a23edcfdfd5b71a6178953be

podSecurityContext:
  fsGroup: 1000

containerSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  readOnlyRootFilesystem: true
  runAsNonRoot: true

service:
  http:
    type: ClusterIP
    port: 3000
  ssh:
    type: LoadBalancer
    port: 22
    externalTrafficPolicy: Local
    annotations:
      metallb.io/loadBalancerIPs: '10.77.20.220'

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: ws-nentwich
    traefik.ingress.kubernetes.io/router.tls: 'true'
    traefik.ingress.kubernetes.io/router.middlewares: forgejo-csp-header@kubernetescrd
  hosts:
    - host: git.nentwich.dev
      paths:
        - path: /
          pathType: Prefix
          port: http
  tls: []

persistence:
  enabled: true
  create: true
  mount: true
  claimName: forgejo-data-pvc
  size: 16Gi

gitea:
  config:
    APP_NAME: 'Forgejo'

    database:
      DB_TYPE: postgres
      HOST: postgres-rw.cnpg-database.svc.cluster.local:5432
      NAME: forgejo

    server:
      ROOT_URL: 'https://git.nentwich.dev'

    service:
      DISABLE_REGISTRATION: 'true'

    actions:
      ENABLED: 'true'

    webhook:
      ALLOWED_HOST_LIST: external

    repository.signing:
      FORMAT: ssh
      SIGNING_KEY: /data/git/.ssh-signing/key.pub
      SIGNING_NAME: 'Forgejo'
      SIGNING_EMAIL: 'forgejo@nentwich.dev'
      MERGES: always
      CRUD_ACTIONS: always
      DEFAULT_TRUST_MODEL: collaborator

  admin:
    username: '' # delete the default admin user

  additionalConfigFromEnvs:
    - name: FORGEJO__DATABASE__USER
      valueFrom:
        secretKeyRef:
          name: forgejo-db-credentials
          key: username
    - name: FORGEJO__DATABASE__PASSWD
      valueFrom:
        secretKeyRef:
          name: forgejo-db-credentials
          key: password

signing:
  enabled: true
  ssh:
    existingSecret: signing-secret
