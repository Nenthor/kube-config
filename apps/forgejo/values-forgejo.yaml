# yaml-language-server: $schema=https://code.forgejo.org/forgejo-helm/forgejo-helm/raw/branch/main/values.schema.json

global:
  storageClass: 'local-path'

podSecurityContext:
  fsGroup: 1001

containerSecurityContext:
  runAsUser: 1001
  runAsGroup: 1001
  readOnlyRootFilesystem: true
  runAsNonRoot: true

service:
  http:
    type: ClusterIP
    port: 3000
  ssh:
    type: LoadBalancer
    port: 22
    annotations:
      metallb.io/loadBalancerIPs: '10.77.20.200'
      metallb.io/allow-shared-ip: 'shared-traefik-forgejo-ip'

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: ws-nentwich
    traefik.ingress.kubernetes.io/router.tls: 'true'
    traefik.ingress.kubernetes.io/router.middlewares: forgejo-csp-header@kubernetescrd
  hosts:
    - host: git.nentwich.dev
      paths:
        - path: /
          pathType: Prefix
          port: http
  tls: []

persistence:
  enabled: true
  create: true
  mount: true
  claimName: forgejo-data-pvc
  size: 16Gi

gitea:
  config:
    APP_NAME: 'Forgejo'

    database:
      DB_TYPE: postgres
      HOST: postgres-rw.cnpg-database.svc.cluster.local:5432
      NAME: forgejo

    server:
      ROOT_URL: 'https://git.nentwich.dev'

    actions:
      ENABLED: 'true'

    webhook:
      ALLOWED_HOST_LIST: external

  admin:
    username: '' # delete the default admin user

  additionalConfigFromEnvs:
    - name: FORGEJO__DATABASE__USER
      valueFrom:
        secretKeyRef:
          name: forgejo-db-credentials
          key: username
    - name: FORGEJO__DATABASE__PASSWD
      valueFrom:
        secretKeyRef:
          name: forgejo-db-credentials
          key: password
