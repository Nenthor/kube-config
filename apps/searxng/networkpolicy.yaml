apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: searxng-isolation
  namespace: searxng
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  podSelector:
    matchLabels:
      app: searxng-app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        # web access
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        # Open WebUI access
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: open-webui
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Public internet only.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8
              - 192.168.0.0/16
              - 172.16.0.0/12
              - 169.254.0.0/16 # Link-local
