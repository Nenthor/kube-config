apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng-app
  namespace: searxng
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng-app
  template:
    metadata:
      labels:
        app: searxng-app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 977
        runAsGroup: 977
        fsGroup: 977
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: searxng-container
          image: searxng/searxng:2026.9.10-931fd9787
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: FORCE_OWNERSHIP
              value: 'false'
            - name: GRANIAN_HOST
              value: '0.0.0.0'
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: searxng-secret
                  key: SEARXNG_SECRET
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: '1'
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - mountPath: /etc/searxng
              name: settings
              readOnly: true
            - mountPath: /var/cache/searxng
              name: cache
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: settings
          configMap:
            name: searxng-settings
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
