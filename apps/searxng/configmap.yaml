apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
  namespace: searxng
  annotations:
    argocd.argoproj.io/sync-wave: '0'
data:
  settings.yml: |
    use_default_settings:
      engines:
        keep_only:
          - brave
          - duckduckgo web

    general:
      instance_name: 'home-search'
      contact_url: false
      enable_metrics: true
      debug: false

    server:
      secret_key: ''
      limiter: false
      public_instance: false
      image_proxy: true

    search:
      safe_search: 0
      autocomplete: 'brave'
      formats:
        - html
        - json

    categories_as_tabs:
      general:

    ui:
      static_use_hash: true
      infinite_scroll: true

    outgoing:
      request_timeout: 5.0
      max_request_timeout: 10.0
      pool_connections: 100
      pool_maxsize: 20

    engines:
      - name: brave
        disabled: false
        weight: 1.6

      - name: duckduckgo web
        disabled: false
        weight: 1.5
