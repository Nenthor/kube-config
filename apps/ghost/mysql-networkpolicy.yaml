apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-ingress
  namespace: ghost
spec:
  podSelector:
    matchLabels:
      app: mysql-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ghost
      ports:
        - protocol: TCP
          port: 3306
