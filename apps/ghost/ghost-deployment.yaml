apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghost-app
  namespace: ghost
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ghost-app
  template:
    metadata:
      labels:
        app: ghost-app
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
      containers:
        - name: ghost-container
          image: ghost:6.59.0-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
              add: ['CHOWN', 'SETUID', 'SETGID']
          ports:
            - containerPort: 2368
          env:
            - name: NODE_ENV
              value: production
            - name: url
              value: https://pillagernews.com
            - name: admin__url
              value: https://admin.pillagernews.com
            - name: database__client
              value: mysql
            - name: database__connection__host
              value: mysql-service
            - name: database__connection__user
              value: ghost
            - name: database__connection__database
              value: ghost
            - name: database__connection__password
              valueFrom:
                secretKeyRef:
                  name: ghost-db-secret
                  key: MYSQL_PASSWORD
            # Caught by Mailpit (apps/mailpit) instead of real delivery
            - name: mail__transport
              value: SMTP
            - name: mail__options__host
              value: mailpit-service.mailpit.svc.cluster.local
            - name: mail__options__port
              value: '1025'
            - name: mail__options__secure
              value: 'false'
            - name: mail__from
              value: "'PillagerNews' <do-not-reply@pillagernews.com>"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 512Mi
          volumeMounts:
            - mountPath: /var/lib/ghost/content
              name: ghost-data
      volumes:
        - name: ghost-data
          persistentVolumeClaim:
            claimName: ghost-pvc
