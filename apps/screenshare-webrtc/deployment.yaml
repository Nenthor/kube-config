apiVersion: apps/v1
kind: Deployment
metadata:
  name: screenshare-webrtc-app
  namespace: screenshare-webrtc
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: screenshare-webrtc-app
  template:
    metadata:
      labels:
        app: screenshare-webrtc-app
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: screenshare-webrtc-container
          image: git.nentwich.dev/nentwich/screenshare-webrtc:0.0.2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: '8000'
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: tmp
          emptyDir: {}
