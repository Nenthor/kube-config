apiVersion: apps/v1
kind: Deployment
metadata:
  name: screenshare-webrtc-app
  namespace: screenshare-webrtc
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: screenshare-webrtc-app
  template:
    metadata:
      labels:
        app: screenshare-webrtc-app
    spec:
      containers:
        - name: screenshare-webrtc-container
          image: git.nentwich.dev/nentwich/screenshare-webrtc:0.0.2
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: '8000'
          resources:
            requests:
              memory: 32Mi
              cpu: 1m
            limits:
              cpu: 10m
              memory: 128Mi
