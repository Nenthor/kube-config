apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: screenshare-webrtc-route
  namespace: screenshare-webrtc
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  entryPoints:
    - websecure-nentwich
  routes:
    - kind: Rule
      match: Host(`screenshare.nentwich.dev`)
      services:
        - name: screenshare-webrtc-service
          port: 80
          middlewares:
            - name: csp-header

  tls: {}

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: csp-header
  namespace: screenshare-webrtc
spec:
  headers:
    contentSecurityPolicy: "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self' https: wss:; font-src 'self' data:; manifest-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;"
