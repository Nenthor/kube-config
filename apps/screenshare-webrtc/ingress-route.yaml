apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: route
  namespace: screenshare-webrtc
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`screenshare.nentwich.dev`)
      priority: 10
      services:
        - name: service
          port: 80

  tls: {}
