apiVersion: apps/v1
kind: Deployment
metadata:
  name: infra-bot-app
  namespace: infra-bot
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infra-bot-app
  template:
    metadata:
      labels:
        app: infra-bot-app
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: git-registry-secret
      containers:
        - name: infra-bot-container
          image: git.nentwich.dev/nentwich/infra-bot:1.0.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          envFrom:
            - secretRef:
                name: infra-bot-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
