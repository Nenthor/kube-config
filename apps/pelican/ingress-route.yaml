apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pelican-panel-route
  namespace: pelican
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`gamepanel.nentwich.dev`)
      priority: 10
      services:
        - name: pelican-panel-service
          port: 80

  tls:
    options:
      name: pelican-tls
      namespace: traefik
