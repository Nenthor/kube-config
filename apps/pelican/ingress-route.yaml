apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pelican-panel-civtale-de-route
  namespace: pelican
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  entryPoints:
    - websecure-hytale
  routes:
    - kind: Rule
      match: Host(`gamepanel.civtale.de`)
      services:
        - name: pelican-panel-service
          port: 80
          middlewares:
            - name: csp-header

  tls: {}

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: csp-header
  namespace: pelican
spec:
  headers:
    contentSecurityPolicy: "default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https: wss:; font-src 'self' data:; manifest-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;"
