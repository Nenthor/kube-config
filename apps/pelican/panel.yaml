apiVersion: apps/v1
kind: Deployment
metadata:
  name: pelican-panel
  namespace: pelican
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pelican-panel
  template:
    metadata:
      labels:
        app: pelican-panel
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 33
      containers:
        - name: panel
          image: ghcr.io/pelican/panel:1.0.0-beta35
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
              add: ['CHOWN', 'SETUID', 'SETGID', 'NET_BIND_SERVICE']
          envFrom:
            - secretRef:
                name: pelican-panel-credentials
          env:
            - name: BEHIND_PROXY
              value: 'true'
            - name: TRUSTED_PROXIES
              value: '10.42.0.0/16'
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: panel-data
              mountPath: /pelican-data
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: panel-data
          persistentVolumeClaim:
            claimName: panel-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: pelican-panel-service
  namespace: pelican
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  selector:
    app: pelican-panel
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
