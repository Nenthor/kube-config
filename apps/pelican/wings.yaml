apiVersion: v1
kind: Service
metadata:
  name: pelican-wings-service
  namespace: pelican
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Endpoints
metadata:
  name: pelican-wings-service
  namespace: pelican
subsets:
  - addresses:
      - ip: 10.77.20.5
    ports:
      - port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pelican-wings-route
  namespace: pelican
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`gamepanel-wings.nentwich.dev`)
      kind: Rule
      services:
        - name: pelican-wings-service
          port: 80

  tls:
    options:
      name: pelican-tls
      namespace: pelican
