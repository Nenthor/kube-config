apiVersion: v1
kind: Service
metadata:
  name: pelican-wings-service
  namespace: pelican
spec:
  type: ExternalName
  externalName: 10.77.20.5
  ports:
    - name: http
      port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pelican-wings-route
  namespace: pelican
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`gamepanel-wings.civtale.de`)
      kind: Rule
      services:
        - name: pelican-wings-service
          port: 8080

  tls: {}
