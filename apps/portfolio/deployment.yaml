apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-app
  namespace: portfolio
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-app
  template:
    metadata:
      labels:
        app: portfolio-app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portfolio-container
          image: git.nentwich.dev/nentwich/portfolio:1.0.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: '8080'
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: conf-d
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 128Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: conf-d
          emptyDir:
            sizeLimit: 1Mi
