apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-app
  namespace: portfolio
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-app
  template:
    metadata:
      labels:
        app: portfolio-app
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portfolio-container
          image: git.nentwich.dev/nentwich/portfolio:1.0.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
              add: ['NET_BIND_SERVICE', 'CHOWN', 'SETUID', 'SETGID']
          ports:
            - containerPort: 80
          env:
            - name: PORT
              value: '80'
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 128Mi
