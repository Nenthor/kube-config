#!/usr/sbin/nft -f
# check:  sudo nft -c -f /etc/nftables.conf
# apply:  sudo nft -f /etc/nftables.conf
# reload: sudo systemctl reload nftables
# read counter: sudo nft list table inet filter

define GATEWAY_SSH = 2603:c020:8026:7fcd:6293:91a0:33e5:d23a
define GATEWAY_WG  = 2603:c020:8026:7fcd:d234:8efa:a05b:5190

define WAN = "enp0s6"               # interface internet
define WAN_NENTWICH = 10.0.0.195    # -> 79.76.106.145
define WAN_HYTALE   = 10.0.0.46     # -> 150.230.155.144

define PRD = "wg0"                           # interface wireguard
define PRD_SUBNET        = 10.77.20.0/24     # homlab PRD network
define PRD_NENTWICH_WEB  = 10.77.20.200
define PRD_NENTWICH_GIT  = 10.77.20.220      # forgejo ssh
define PRD_NENTWICH_GAME = 10.77.20.5        # pelican gameserver
define PRD_HYTALE_WEB    = 10.77.20.202
define PRD_HYTALE_GAME   = 10.77.20.5        # pelican gameserver

# Allowed ICMP types
define ICMP_ALLOWED = {
    destination-unreachable, time-exceeded, parameter-problem
}
define ICMPV6_ALLOWED = {
    destination-unreachable, packet-too-big, time-exceeded, parameter-problem,
    mld-listener-query, mld-listener-report, mld-listener-done, mld2-listener-report
}
define ICMPV6_NDP = {
    nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert
}

table ip nat
flush table ip nat

table inet filter
flush table inet filter

table ip nat {
    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;

        # ws-nentwich
        iifname $WAN ip daddr $WAN_NENTWICH tcp dport { 80, 443 } dnat to $PRD_NENTWICH_WEB
        iifname $WAN ip daddr $WAN_NENTWICH udp dport 443 dnat to $PRD_NENTWICH_WEB
        iifname $WAN ip daddr $WAN_NENTWICH tcp dport 22 dnat to $PRD_NENTWICH_GIT
        iifname $WAN ip daddr $WAN_NENTWICH udp dport 7777 dnat to $PRD_NENTWICH_GAME # ark ascended

        # ws-hytale
        iifname $WAN ip daddr $WAN_HYTALE tcp dport { 80, 443 } dnat to $PRD_HYTALE_WEB
        iifname $WAN ip daddr $WAN_HYTALE udp dport 443 dnat to $PRD_HYTALE_WEB
        iifname $WAN ip daddr $WAN_HYTALE udp dport 5520 dnat to $PRD_HYTALE_GAME # hytale
        iifname $WAN ip daddr $WAN_HYTALE tcp dport 25542 dnat to $PRD_HYTALE_GAME # minecraft
        iifname $WAN ip daddr $WAN_HYTALE udp dport 24442 dnat to $PRD_HYTALE_GAME # minecraft voicechat
    }

    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;

        # Force gameserver to always use hytale public ip
        oifname $WAN ip saddr $PRD_HYTALE_GAME snat to $WAN_HYTALE

        # Allow all from PRD to reach internet
        oifname $WAN ip saddr $PRD_SUBNET masquerade
    }
}

table inet filter {
    chain prerouting {
        type filter hook prerouting priority raw; policy accept;

        # Drop PRD ip from Internet
        iifname $WAN ip saddr $PRD_SUBNET counter drop

        # Drop localhost on non-"lo" interface
        iifname != "lo" ip saddr 127.0.0.0/8 counter drop
        iifname != "lo" ip6 saddr ::1 counter drop
    }

    chain input {
        type filter hook input priority filter; policy drop;

        ct state invalid counter drop
        ct state established,related accept
        iif "lo" accept

        # ICMP (with rate limit)
        meta l4proto icmp icmp type echo-request limit rate 5/second burst 10 packets accept
        meta l4proto icmp icmp type echo-request counter drop
        meta l4proto icmp icmp type $ICMP_ALLOWED accept

        # ICMPv6 (with rate limit)
        meta l4proto ipv6-icmp icmpv6 type echo-request limit rate 5/second burst 10 packets accept
        meta l4proto ipv6-icmp icmpv6 type echo-request counter drop
        meta l4proto ipv6-icmp icmpv6 type $ICMPV6_ALLOWED accept
        meta l4proto ipv6-icmp icmpv6 type $ICMPV6_NDP ip6 hoplimit 255 accept

        # SSH (with rate limit)
        ip6 daddr $GATEWAY_SSH tcp dport 22 ct state new limit rate 15/minute burst 15 packets accept

        # Wireguard
        ip6 daddr $GATEWAY_WG udp dport 51820 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state invalid counter drop
        ct state established,related accept

        # Force correct MTU size
        tcp flags syn tcp option maxseg size set rt mtu

        # Homelab reaching out to the internet
        iifname $PRD oifname $WAN ip saddr $PRD_SUBNET accept

        # Allow internet reaching published services
        iifname $WAN oifname $PRD ct state new ip daddr $PRD_NENTWICH_WEB tcp dport { 80, 443 } accept
        iifname $WAN oifname $PRD ct state new ip daddr $PRD_NENTWICH_WEB udp dport 443 accept
        iifname $WAN oifname $PRD ct state new ip daddr $PRD_NENTWICH_GIT tcp dport 22 accept
        iifname $WAN oifname $PRD ct state new ip daddr $PRD_NENTWICH_GAME udp dport 7777 accept

        iifname $WAN oifname $PRD ct state new ip daddr $PRD_HYTALE_WEB tcp dport { 80, 443 } accept
        iifname $WAN oifname $PRD ct state new ip daddr $PRD_HYTALE_WEB udp dport 443 accept
        iifname $WAN oifname $PRD ct state new ip daddr $PRD_HYTALE_GAME udp dport 5520 accept
        iifname $WAN oifname $PRD ct state new ip daddr $PRD_HYTALE_GAME tcp dport 25542 accept
        iifname $WAN oifname $PRD ct state new ip daddr $PRD_HYTALE_GAME udp dport 24442 accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
