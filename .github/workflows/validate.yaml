name: Validate manifests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Render and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          mise_toml: |
            [tools]
            helm = "3.19.0"
            kustomize = "5.7.1"
            kubeconform = "0.7.0"

      - name: Cache pulled Helm charts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/helm
            ~/.local/share/helm
          key: helm-${{ hashFiles('**/kustomization.yaml') }}
          restore-keys: helm-

      - name: Render
        run: |
          mkdir -p rendered
          while read -r dir; do
            echo "  $dir"
            kustomize build --enable-helm "$dir" > "rendered/${dir//\//_}.yaml"
          done < <(find apps infrastructure -name kustomization.yaml -printf '%h\n' | sort)
          { for f in bootstrap/*.yaml root-app.yaml; do echo '---'; cat "$f"; done; } > rendered/bootstrap.yaml

      - name: Validate against schemas
        run: |
          kubeconform -strict -summary -ignore-missing-schemas \
            -skip IngressRoute,ImageUpdater \
            -kubernetes-version 1.31.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered/

      - name: Run security scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: rendered
          exit-code: '0'
          hide-progress: true
          output: trivy.txt

      - name: Publish security scanner output to summary
        run: |
          if [[ -s trivy.txt ]]; then
            {
              echo "### Security Output"
              echo "<details><summary>Click to expand</summary>"
              echo ""
              echo '```terraform'
              cat trivy.txt
              echo '```'
              echo "</details>"
            } >> $GITHUB_STEP_SUMMARY
          fi

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
