storageClasses:
  - name: home-nfs-data
    annotations:
      storageclass.kubernetes.io/is-default-class: 'false'
    reclaimPolicy: Retain
    volumeBindingMode: Immediate
    parameters:
      server: '10.77.20.3'
      share: '/k3s-data'
      onDelete: 'retain'
      subDir: '${pvc.metadata.namespace}-${pvc.metadata.name}'
    mountOptions:
      - nfsvers=4.2
      - noatime
      - nodiratime
      - rsize=1048576
      - wsize=1048576
      - nconnect=8
      - tcp
      - hard

  - name: home-nfs-media
    annotations:
      storageclass.kubernetes.io/is-default-class: 'false'
    reclaimPolicy: Delete
    volumeBindingMode: Immediate
    parameters:
      server: '10.77.20.3'
      share: '/k3s-media'
      onDelete: 'delete'
      subDir: '${pvc.metadata.namespace}-${pvc.metadata.name}'
    mountOptions:
      - nfsvers=4.2
      - noatime
      - nodiratime
      - rsize=1048576
      - wsize=1048576
      - nconnect=8
      - tcp
      - hard
