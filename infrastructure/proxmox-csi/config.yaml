# Create privileged proxmox-csi namespace
apiVersion: v1
kind: Namespace
metadata:
  name: proxmox-csi
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
# Set node labels
apiVersion: v1
kind: Node
metadata:
  name: kube-central-1
  labels:
    topology.kubernetes.io/region: home
    topology.kubernetes.io/zone: proxmox # Must match the exact physical Proxmox VE node name
---
# Proxmox user token as secret
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: proxmox-csi-config-secret
  namespace: proxmox-csi
spec:
  encryptedData:
    config.yaml: 
  template:
    metadata:
      name: proxmox-csi-config-secret
      namespace: proxmox-csi
    type: Opaque
