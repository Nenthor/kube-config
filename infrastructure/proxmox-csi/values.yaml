existingConfigSecret: proxmox-csi-config-secret
existingConfigSecretKey: config.yaml

storageClass:
  - name: home-lvm-thin
    storage: local-lvm
    reclaimPolicy: Delete
    fstype: ext4
    cache: none
    ssd: true
    volumeBindingMode: WaitForFirstConsumer
    mountOptions:
      - discard

    # Define the storage class as default
    annotations:
      storageclass.kubernetes.io/is-default-class: 'true'
