apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generatorOptions:
  disableNameSuffixHash: true

helmCharts:
  - name: traefik
    repo: oci://ghcr.io/sergelogvinov/charts
    version: 0.5.7
    releaseName: proxmox-csi-plugin
    namespace: proxmox-csi
    includeCRDs: true
    valuesFile: values.yaml

resources:
  - config.yaml
