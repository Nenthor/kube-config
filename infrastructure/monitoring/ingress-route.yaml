apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-ingress-route
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  entryPoints:
    - websecure
  routes:
    # 1. Standard Web UI Router
    - kind: Rule
      match: Host(`grafana.home.nentwich.dev`)
      services:
        - name: kube-prometheus-stack-grafana
          port: 80

  tls: {}
