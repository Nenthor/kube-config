# https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml

cleanPrometheusOperatorObjectNames: true

defaultRules:
  create: false

grafana:
  enabled: true

  admin:
    existingSecret: 'grafana-admin-credentials'
    userKey: 'admin-user'
    passwordKey: 'admin-password'

  initChownData:
    enabled: false

  serviceMonitor:
    selfMonitor: false

  defaultDashboardsEnabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    storageClassName: local-path
    accessModes: ['ReadWriteOnce']
    size: 2Gi

  sidecar:
    dashboards:
      enabled: true
      env:
        HEALTH_PORT: '8081'
    datasources:
      enabled: true
      env:
        HEALTH_PORT: '8082'

  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      jsonData:
        maxLines: 1000

alertmanager:
  enabled: true

  serviceMonitor:
    selfMonitor: false

  alertmanagerSpec:
    replicas: 1
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ['ReadWriteOnce']
          resources:
            requests:
              storage: 1Gi

prometheus:
  enabled: true

  serviceMonitor:
    selfMonitor: false

  prometheusSpec:
    replicas: 1
    retention: 7d
    retentionSize: 8GiB
    scrapeInterval: 30s

    additionalMetricRelabelings:
      - sourceLabels: [__name__]
        action: keep
        regex: '^(container_cpu_usage_seconds_total|container_memory_working_set_bytes|kubelet_volume_stats_available_bytes)$'

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1024Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ['ReadWriteOnce']
          resources:
            requests:
              storage: 10Gi

# Disable unnecessary monitors
kubeApiServer:
  enabled: false
kubeControllerManager:
  enabled: false
coreDns:
  enabled: false
kubeDns:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
nodeExporter:
  enabled: false
prometheusOperator:
  enabled: false
kube-state-metrics:
  enabled: false

kubelet:
  enabled: true # Container CPU/RAM and PVC disk metrics
  serviceMonitor:
    metricRelabelings:
      - sourceLabels: [__name__]
        action: keep
        regex: '^(container_cpu_usage_seconds_total|container_memory_working_set_bytes|kubelet_volume_stats_available_bytes)$'
    cAdvisorMetricRelabelings:
      - sourceLabels: [__name__]
        action: keep
        regex: '^(container_cpu_usage_seconds_total|container_memory_working_set_bytes|kubelet_volume_stats_available_bytes)$'
