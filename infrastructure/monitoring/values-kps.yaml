# https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml

cleanPrometheusOperatorObjectNames: true

defaultRules:
  create: false

grafana:
  enabled: true

  admin:
    existingSecret: 'grafana-admin-credentials'
    userKey: 'admin-user'
    passwordKey: 'admin-password'

  initChownData:
    enabled: false

  serviceMonitor:
    selfMonitor: false

  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.tls: 'true'
      traefik.ingress.kubernetes.io/router.entrypoints: ws-home
    hosts:
      - monitoring.home.nentwich.dev
    tls:
      - hosts:
          - monitoring.home.nentwich.dev

  defaultDashboardsEnabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    storageClassName: local-path
    accessModes: ['ReadWriteOnce']
    size: 2Gi

  priorityClassName: platform-important

  sidecar:
    dashboards:
      enabled: true
      env:
        HEALTH_PORT: '8081'
    datasources:
      enabled: true
      alertmanager:
        enabled: false
      env:
        HEALTH_PORT: '8082'
    alerts:
      enabled: true
      label: grafana_alert
      labelValue: '1'
      searchNamespace: monitoring
      env:
        HEALTH_PORT: '8083'

alertmanager:
  enabled: false

prometheus:
  enabled: true

  serviceMonitor:
    selfMonitor: false

  prometheusSpec:
    replicas: 1
    priorityClassName: platform-important
    retention: 365d
    retentionSize: 8GiB
    scrapeInterval: 30s

    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1024Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ['ReadWriteOnce']
          resources:
            requests:
              storage: 10Gi

# Disable unnecessary monitors
kubeApiServer:
  enabled: false
kubeControllerManager:
  enabled: false
coreDns:
  enabled: false
kubeDns:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
nodeExporter:
  enabled: true
prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      cpu: 100m
      memory: 64Mi
  prometheus:
    monitor:
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: 'node_filesystem_(avail_bytes|size_bytes|files|files_free|readonly)|node_memory_(MemAvailable_bytes|MemTotal_bytes)|node_load(1|5|15)|node_cpu_seconds_total|node_time_seconds|node_boot_time_seconds|node_vmstat_pgmajfault'
          action: keep
        # Only real filesystems - drop the per-container overlay/tmpfs noise.
        - sourceLabels: [fstype]
          regex: 'tmpfs|overlay|squashfs|ramfs|fuse.*|iso9660|autofs|binfmt_misc|cgroup.*|debugfs|devpts|mqueue|nsfs|proc|sysfs|tracefs'
          action: drop

kubeStateMetrics:
  enabled: true
kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      cpu: 100m
      memory: 128Mi
  metricLabelsAllowlist:
    - pods=[app]
  collectors:
    - pods
    - deployments
    - statefulsets
    - daemonsets
    - nodes
    - persistentvolumeclaims
    - jobs
    - cronjobs
  prometheus:
    monitor:
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: 'kube_pod_container_status_(restarts_total|last_terminated_reason|waiting_reason|ready)|kube_pod_container_resource_(limits|requests)|kube_pod_status_(phase|ready)|kube_deployment_status_replicas_(available|unavailable)|kube_deployment_spec_replicas|kube_statefulset_status_replicas_ready|kube_statefulset_replicas|kube_daemonset_status_number_(ready|unavailable)|kube_daemonset_status_desired_number_scheduled|kube_node_status_condition|kube_node_spec_unschedulable|kube_persistentvolumeclaim_status_phase|kube_job_status_failed|kube_job_failed'
          action: keep

prometheusOperator:
  enabled: true
kubelet:
  enabled: true # Container CPU/RAM and PVC disk metrics
  serviceMonitor:
    cAdvisorMetricRelabelings:
      - sourceLabels: [__name__]
        regex: 'container_cpu_usage_seconds_total|container_memory_working_set_bytes'
        action: keep
    metricRelabelings:
      - sourceLabels: [__name__]
        regex: 'kubelet_volume_stats_(available|capacity|used)_bytes|kubelet_volume_stats_inodes(_free|_used)?'
        action: keep
