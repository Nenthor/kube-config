# https://github.com/grafana/loki/blob/main/production/helm/loki/values.yaml

deploymentMode: Monolithic

loki:
  auth_enabled: false

  analytics:
    reporting_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: '2026-01-01'
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  limits_config:
    # GeoIP results and the client IP ride along as structured metadata.
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 30d
    # A single misplaced dashboard query should not take the pod down.
    max_query_series: 5000
    max_entries_limit_per_query: 10000

  compactor:
    retention_enabled: true
    delete_request_store: filesystem

  ingester:
    chunk_encoding: snappy

  pattern_ingester:
    enabled: false

singleBinary:
  replicas: 1
  priorityClassName: platform-important
  # The ruler sidecar watches for rule ConfigMaps we do not have.
  sidecar: false
  persistence:
    enabled: true
    storageClass: local-path
    accessModes: ['ReadWriteOnce']
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 1Gi

monitoring:
  serviceMonitor:
    enabled: true

# The simple-scalable targets stay at zero replicas in Monolithic mode.
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

# Not needed for a single-tenant, single-replica install.
sidecar:
  rules:
    enabled: false
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
