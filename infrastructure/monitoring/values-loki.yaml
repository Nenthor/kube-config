# yaml-language-server: $schema=https://github.com/grafana-community/helm-charts/raw/refs/heads/main/charts/loki/values.schema.json

deploymentMode: Monolithic

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: local-path
    size: 10Gi

write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: '2024-01-01'
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules

  limits_config:
    retention_period: 168h # 7 days
    reject_old_samples: true
    reject_old_samples_max_age: 168h

  # prune logs
  compactor:
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_enabled: true
    retention_delete_delay: 2h
    retention_delete_worker_count: 15
    delete_request_store: filesystem
    shared_store: filesystem

# Disable all scaling features, caches, and test workloads to save RAM
ruler: { enabled: false }
resultsCache: { enabled: false }
chunksCache: { enabled: false }
gateway: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
memcached: { enabled: false }
memcachedExporter: { enabled: false }
