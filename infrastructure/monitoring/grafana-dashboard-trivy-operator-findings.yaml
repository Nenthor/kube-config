# Every individual Trivy Operator finding and where it is, from the *_info
# metrics enabled in infrastructure/trivy-operator/values.yaml. The upstream
# Trivy dashboards next to this one only show counts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-trivy-operator-findings
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
  annotations:
    argocd.argoproj.io/sync-wave: '1'
data:
  trivy-operator-findings.json: |
    {
      "uid": "trivy-findings",
      "title": "Trivy Operator - Findings",
      "description": "Every individual Trivy Operator finding and where it is, from the *_info metrics. Counts and trends live in the two upstream Trivy dashboards.",
      "tags": [
        "homelab",
        "trivy",
        "security"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "5m",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "links": [
        {
          "title": "Trivy dashboards",
          "type": "dashboards",
          "tags": [
            "trivy"
          ],
          "asDropdown": true,
          "includeVars": false,
          "keepTime": true
        }
      ],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "label_values(trivy_image_vulnerabilities, namespace)",
            "query": {
              "qryType": 1,
              "query": "label_values(trivy_image_vulnerabilities, namespace)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            }
          },
          {
            "name": "severity",
            "label": "Severity",
            "type": "custom",
            "query": "Critical,High,Medium,Low,Unknown",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            }
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Images",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "table",
          "title": "Exposed secrets",
          "description": "Secrets found inside container image files. File is the path inside the image.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "filterable": true
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Severity"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "Critical": {
                            "color": "dark-red",
                            "index": 0
                          },
                          "High": {
                            "color": "red",
                            "index": 1
                          },
                          "Medium": {
                            "color": "orange",
                            "index": 2
                          },
                          "Low": {
                            "color": "yellow",
                            "index": 3
                          },
                          "Unknown": {
                            "color": "text",
                            "index": 4
                          },
                          "CRITICAL": {
                            "text": "Critical",
                            "color": "dark-red",
                            "index": 5
                          },
                          "HIGH": {
                            "text": "High",
                            "color": "red",
                            "index": 6
                          },
                          "MEDIUM": {
                            "text": "Medium",
                            "color": "orange",
                            "index": 7
                          },
                          "LOW": {
                            "text": "Low",
                            "color": "yellow",
                            "index": 8
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "custom.width",
                    "value": 90
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            },
            "sortBy": [
              {
                "displayName": "Severity",
                "desc": false
              }
            ]
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true
                },
                "renameByName": {
                  "severity": "Severity",
                  "namespace": "Namespace",
                  "resource_kind": "Kind",
                  "resource_name": "Resource",
                  "container_name": "Container",
                  "image": "Image",
                  "secret_target": "File",
                  "secret_rule_id": "Rule",
                  "secret_title": "Title",
                  "secret_category": "Category"
                },
                "indexByName": {
                  "severity": 0,
                  "namespace": 1,
                  "resource_kind": 2,
                  "resource_name": 3,
                  "container_name": 4,
                  "image": 5,
                  "secret_target": 6,
                  "secret_rule_id": 7,
                  "secret_title": 8,
                  "secret_category": 9
                }
              }
            }
          ],
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "max by (severity, namespace, resource_kind, resource_name, container_name, image, secret_target, secret_rule_id, secret_title, secret_category) (label_join(label_join(trivy_exposedsecrets_info{namespace=~\"$namespace\", severity=~\"$severity\"}, \"image\", \"/\", \"image_registry\", \"image_repository\"), \"image\", \":\", \"image\", \"image_tag\"))",
              "format": "table",
              "instant": true,
              "range": false
            }
          ]
        },
        {
