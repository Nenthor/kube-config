              "editorMode": "code",
              "expr": "max by (severity, vuln_score, vuln_id, namespace, resource_name, container_name, image, resource, installed_version, fixed_version, vuln_title, target, pkg_path, class) (label_join(label_join(trivy_vulnerability_id{namespace=~\"$namespace\", severity=~\"$severity\"}, \"image\", \"/\", \"image_registry\", \"image_repository\"), \"image\", \":\", \"image\", \"image_tag\"))",
              "format": "table",
              "instant": true,
              "range": false
