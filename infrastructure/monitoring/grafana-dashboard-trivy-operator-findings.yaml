                  "vuln_score": "Score",
                  "vuln_id": "ID",
                  "namespace": "Namespace",
                  "resource_name": "Resource",
                  "container_name": "Container",
                  "image": "Image",
                  "resource": "Package",
                  "installed_version": "Installed",
                  "fixed_version": "Fixed in",
                  "vuln_title": "Title",
                  "target": "Target",
                  "pkg_path": "Path",
                  "class": "Class"
                },
                "indexByName": {
                  "severity": 0,
                  "vuln_score": 1,
                  "vuln_id": 2,
                  "namespace": 3,
                  "resource_name": 4,
                  "container_name": 5,
                  "image": 6,
                  "resource": 7,
                  "installed_version": 8,
                  "fixed_version": 9,
                  "vuln_title": 10,
                  "target": 11,
                  "pkg_path": 12,
                  "class": 13
