apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: kube-prometheus-stack
    repo: oci://ghcr.io/prometheus-community/charts/
    version: 89.2.0
    releaseName: kube-prometheus-stack
    namespace: monitoring
    includeCRDs: true
    valuesFile: values-kps.yaml
  - name: loki
    repo: oci://ghcr.io/grafana-community/helm-charts/
    version: 18.12.1
    releaseName: loki
    namespace: monitoring
    includeCRDs: true
    valuesFile: values-loki.yaml
    apiVersions:
      - monitoring.coreos.com/v1
  - name: alloy
    repo: https://grafana.github.io/helm-charts
    version: 1.12.1
    releaseName: alloy
    namespace: monitoring
    includeCRDs: true
    valuesFile: values-alloy.yaml
    apiVersions:
      - monitoring.coreos.com/v1

resources:
  - grafana-admin-credentials.yaml
  - alloy-geoip-pvc.yaml
  - pvc-alerts.yaml
  - cluster-alerts.yaml
  - edge-alerts.yaml
  - argocd-servicemonitors.yaml
  - argocd-alerts.yaml
  - grafana-alerting.yaml
  - grafana-contactpoint-secret.yaml
  - grafana-dashboard-homelab.yaml
  - grafana-dashboard-traefik.yaml
