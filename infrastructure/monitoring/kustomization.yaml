apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: kube-prometheus-stack
    repo: oci://ghcr.io/prometheus-community/charts/
    version: 86.1.0
    releaseName: kube-prometheus-stack
    namespace: monitoring
    includeCRDs: true
    valuesFile: values-kps.yaml

  - name: loki
    repo: oci://ghcr.io/grafana-community/helm-charts
    version: 17.1.6
    releaseName: loki
    namespace: monitoring
    includeCRDs: true
    valuesFile: values-loki.yaml

  - name: alloy
    repo: https://grafana.github.io/helm-charts
    version: 1.8.2
    releaseName: alloy
    namespace: monitoring
    includeCRDs: true
    valuesFile: values-alloy.yaml

