apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: kube-prometheus-stack
    repo: oci://ghcr.io/prometheus-community/charts/
    version: 89.2.0
    releaseName: kube-prometheus-stack
    namespace: monitoring
    includeCRDs: true
    valuesFile: values-kps.yaml

resources:
  - grafana-admin-credentials.yaml
  - pvc-alerts.yaml
  - cluster-alerts.yaml
  - edge-alerts.yaml
  - grafana-alerting.yaml
  - grafana-contactpoint-secret.yaml
  - grafana-dashboard-homelab.yaml
