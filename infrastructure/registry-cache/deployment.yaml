apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-cache-app
  namespace: registry-cache
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: registry-cache-app
  template:
    metadata:
      labels:
        app: registry-cache-app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry-cache-container
          image: registry:3.0.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          ports:
            - name: registry
              containerPort: 5000
          env:
            - name: OTEL_TRACES_EXPORTER
              value: 'none'
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: registry
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: registry
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - mountPath: /etc/distribution
              name: registry-cache-config
              readOnly: true
            - mountPath: /var/lib/registry
              name: registry-cache-data
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: registry-cache-config
          configMap:
            name: registry-cache-config
        - name: registry-cache-data
          persistentVolumeClaim:
            claimName: registry-cache-pvc
