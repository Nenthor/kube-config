apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-cache-config
  namespace: registry-cache
  annotations:
    argocd.argoproj.io/sync-wave: '0'
data:
  config.yml: |
    version: 0.1

    log:
      level: warn
      formatter: json

    storage:
      filesystem:
        rootdirectory: /var/lib/registry
      delete:
        enabled: true
      maintenance:
        uploadpurging:
          enabled: true
          age: 720h
          interval: 24h
          dryrun: false

    http:
      addr: :5000
      headers:
        X-Content-Type-Options: [nosniff]

    health:
      storagedriver:
        enabled: true
        interval: 10s
        threshold: 3

    proxy:
      remoteurl: https://registry-1.docker.io
      ttl: 720h
