apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-default-deny-ingress
  namespace: cnpg-database
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: postgres
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-clients
  namespace: cnpg-database
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: postgres
  policyTypes:
    - Ingress
  ingress:
    # Namespaces with a managed role in cluster.yaml.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forgejo
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vaultwarden
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pelican
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: open-webui
        # Intra-cluster replication and the -rw/-ro service endpoints.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-database
      ports:
        - protocol: TCP
          port: 5432
    # Operator status/instance-manager port and metrics scraping.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-operator
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-database
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 9187
