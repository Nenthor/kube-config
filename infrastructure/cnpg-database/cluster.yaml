# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/postgresql.cnpg.io/cluster_v1.json

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: cnpg-database
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  instances: 1

  storage:
    size: 16Gi
    storageClass: local-path

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  enableSuperuserAccess: true
  superuserSecret:
    name: postgres-superuser-credentials

  # Add user role per database
  managed:
    roles:
      - name: forgejo
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: forgejo-db-credentials

      - name: vaultwarden
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: vaultwarden-db-credentials

      - name: pelican
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: pelican-db-credentials
