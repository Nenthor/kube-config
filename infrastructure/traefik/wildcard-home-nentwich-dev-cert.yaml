apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-home-nentwich-dev
  namespace: traefik
spec:
  secretName: wildcard-home-nentwich-dev-tls
  issuerRef:
    name: letsencrypt-production # Options: letsencrypt-production or letsencrypt-staging
    kind: ClusterIssuer
  dnsNames:
    - '*.home.nentwich.dev'
