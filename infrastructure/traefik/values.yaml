# yaml-language-server: $schema=https://raw.githubusercontent.com/traefik/traefik-helm-chart/refs/heads/master/traefik/values.schema.json

ingressClass:
  enabled: true
  isDefaultClass: true

service:
  enabled: true
  single: true
  annotations:
    metallb.io/loadBalancerIPs: '10.77.20.200'
    metallb.io/allow-shared-ip: 'shared-traefik-forgejo-ip'

ports:
  # HTTP Entrypoint
  web:
    port: 8000
    exposedPort: 80
    protocol: TCP
    # Global redirect to HTTPS
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  # HTTPS Entrypoint
  websecure:
    port: 8443
    exposedPort: 443
    protocol: TCP
    http:
      tls:
        enabled: true
        options: traefik-secure-tls@kubernetescrd

    http3:
      enabled: false
      advertisedPort: 443

      # Attach middlewares directly to the entrypoint
      # Format: <namespace>-<middlewareName>@kubernetescrd
      # https://doc.traefik.io/traefik/reference/install-configuration/entrypoints/#httpmiddlewares
      middlewares:
        - 'traefik-security-headers@kubernetescrd'
        - 'traefik-compress@kubernetescrd'

# Set default certificate to *.nentwich.dev
tlsStore:
  default:
    defaultCertificate:
      secretName: wildcard-nentwich-dev-tls

extraObjects:
  # Secure TLS
  - apiVersion: traefik.io/v1alpha1
    kind: TLSOption
    metadata:
      name: secure-tls
      namespace: traefik
    spec:
      minVersion: VersionTLS13 # minimum TLS 1.3
      # WARNING: sniStrict=true rejects clients not sending SNI.
      sniStrict: true

  # Secure Headers
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: secure-headers
      namespace: traefik
    spec:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: same-origin
        customResponseHeaders:
          X-Robots-Tag: 'none,noarchive,nosnippet,notranslate,noimageindex'

  # Compression
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: compression
      namespace: traefik
    spec:
      compress: {}
