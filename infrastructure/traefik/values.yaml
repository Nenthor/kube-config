# yaml-language-server: $schema=https://raw.githubusercontent.com/traefik/traefik-helm-chart/refs/heads/master/traefik/values.schema.json

ingressClass:
  enabled: true
  isDefaultClass: true

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
    allowExternalNameServices: true

service:
  enabled: false

experimental:
  plugins:
    crowdsec-bouncer:
      moduleName: 'github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin'
      version: 'v1.7.1'

volumes:
  - name: crowdsec-bouncer-key
    mountPath: '/etc/traefik/crowdsec'
    type: secret

ports:
  # HTTP Entrypoint
  web:
    port: 8000
    exposedPort: 80
    protocol: TCP
    # Global redirect to HTTPS
    http:
      redirections:
        entryPoint:
          to: ws-nentwich
          scheme: https
          permanent: true

  # *.nentwich.dev -> 10.77.20.200 HTTPS
  ws-nentwich:
    port: 8040
    exposedPort: 443
    protocol: TCP
    expose:
      default: false
    http: &securedHttp
      tls:
        enabled: true
      middlewares:
        - 'traefik-crowdsec-bouncer@kubernetescrd'
        - 'traefik-secure-headers@kubernetescrd'
        - 'traefik-compression@kubernetescrd'
      aliasHeadersStrategy: delete
      # https://doc.traefik.io/traefik/v3.7/migrate/v3/#encoded-characters-configuration-default-values
      encodedCharacters:
        allowEncodedSlash: false
        allowEncodedBackSlash: false
        allowEncodedNullCharacter: false
        allowEncodedSemicolon: false
        allowEncodedPercent: false
        allowEncodedQuestionMark: false
        allowEncodedHash: false
    http3: &securedHttp3
      enabled: true
      advertisedPort: 443

  # not used, but traefik default. apply middleware regardless
  websecure:
    port: 8443
    expose:
      default: false
    http: *securedHttp
    http3: *securedHttp3

  # *.home.nentwich.dev -> 10.77.20.201 HTTPS
  ws-home:
    port: 8041
    exposedPort: 443
    protocol: TCP
    expose:
      default: false
    http: *securedHttp
    http3: *securedHttp3

  # *.civtale.de -> 10.77.20.202 HTTPS
  ws-hytale:
    port: 8042
    exposedPort: 443
    protocol: TCP
    expose:
      default: false
    http: *securedHttp
    http3: *securedHttp3

  # Cloudflare ips. Ranges: https://www.cloudflare.com/ips/ (re-check periodically, they do change)
  # ws-pillager:
  #   port: 8043
  #   exposedPort: 443
  #   protocol: TCP
  #   expose:
  #     default: false
  #   forwardedHeaders:
  #     trustedIPs:
  #       - 173.245.48.0/20
  #       - 103.21.244.0/22
  #       - 103.22.200.0/22
  #       - 103.31.4.0/22
  #       - 141.101.64.0/18
  #       - 108.162.192.0/18
  #       - 190.93.240.0/20
  #       - 188.114.96.0/20
  #       - 197.234.240.0/22
  #       - 198.41.128.0/17
  #       - 162.158.0.0/15
  #       - 104.16.0.0/13
  #       - 104.24.0.0/14
  #       - 172.64.0.0/13
  #       - 131.0.72.0/22
  #       - 2400:cb00::/32
  #       - 2606:4700::/32
  #       - 2803:f800::/32
  #       - 2405:b500::/32
  #       - 2405:8100::/32
  #       - 2a06:98c0::/29
  #       - 2c0f:f248::/32
  #   http: *securedHttp
  #   http3: *securedHttp3

priorityClassName: infra-critical

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: '1'
    memory: 512Mi

tlsOptions:
  default:
    minVersion: VersionTLS12
    sniStrict: true

tlsStore:
  default:
    certificates:
      - secretName: wildcard-nentwich-dev-tls
      - secretName: wildcard-home-nentwich-dev-tls
      - secretName: wildcard-civtale-de-tls
      # - secretName: wildcard-pillagernews-com-tls

log:
  format: json
  level: INFO

# One JSON object per request, on stdout. Grafana Alloy tails the pod, resolves
# the client IP against a GeoIP database and ships it to Loki - see
# infrastructure/monitoring. addInternals keeps the requests that never reach a
# router (http->https redirects, unmatched hosts) in the log; the internal
# traefik/metrics entrypoints are dropped again on the Alloy side.
accessLog:
  enabled: true
  format: json
  addInternals: true
  fields:
    defaultMode: keep
    names:
      StartLocal: drop
      ClientAddr: drop
      ClientPort: drop
      ClientUsername: drop
      RequestAddr: drop
      RequestPort: drop
      ServiceAddr: drop
      ServiceURL: drop
      RequestCount: drop
      GzipRatio: drop
      Overhead: drop
      TLSClientSubject: drop
      TraceId: drop
      SpanId: drop
    headers:
      defaultMode: drop
      names:
        User-Agent: keep
        Referer: keep
        # Traefik only rewrites ClientHost for entrypoints that trust the hop in
        # front of them; this keeps the original chain visible either way.
        X-Forwarded-For: keep

metrics:
  prometheus:
    enabled: true
    addRoutersLabels: true
    addServicesLabels: true
    addEntryPointsLabels: true
    service:
      enabled: true
    serviceMonitor:
      enabled: true
      honorLabels: true
