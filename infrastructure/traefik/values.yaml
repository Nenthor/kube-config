# yaml-language-server: $schema=https://raw.githubusercontent.com/traefik/traefik-helm-chart/refs/heads/master/traefik/values.schema.json

ingressClass:
  enabled: true
  isDefaultClass: true

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
    allowExternalNameServices: true

service:
  enabled: true
  single: true
  annotations:
    metallb.io/loadBalancerIPs: '10.77.20.200'
    metallb.io/allow-shared-ip: 'shared-traefik-forgejo-ip'

ports:
  # HTTP Entrypoint
  web:
    port: 8000
    exposedPort: 80
    protocol: TCP
    # Global redirect to HTTPS
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  # HTTPS Entrypoint
  websecure:
    port: 8443
    exposedPort: 443
    protocol: TCP
    http:
      tls:
        enabled: true
        options: traefik-secure-tls@kubernetescrd

      middlewares:
        - 'traefik-secure-headers@kubernetescrd'
        - 'traefik-compression@kubernetescrd'

      # https://doc.traefik.io/traefik/v3.7/migrate/v3/#encoded-characters-configuration-default-values
      encodedCharacters:
        allowEncodedSlash: false
        allowEncodedBackSlash: false
        allowEncodedNullCharacter: false
        allowEncodedSemicolon: false
        allowEncodedPercent: false
        allowEncodedQuestionMark: false
        allowEncodedHash: false

    http3:
      enabled: true
      advertisedPort: 443

tlsOptions:
  default:
    minVersion: VersionTLS13
    sniStrict: false

tlsStore:
  spec:
    certificates:
      - secretName: wildcard-nentwich-dev-tls
      - secretName: wildcard-civtale-de-tls

metrics:
  prometheus:
    addEntryPointsLabels: true # https or http
    addRoutersLabels: true # host & path
    addServicesLabels: true # backend

extraObjects:
  # Secure TLS
  - apiVersion: traefik.io/v1alpha1
    kind: TLSOption
    metadata:
      name: secure-tls
      namespace: traefik
    spec:
      minVersion: VersionTLS13 # minimum TLS 1.2
      # WARNING: sniStrict=true rejects clients not sending SNI.
      sniStrict: true

  # Secure Headers
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: secure-headers
      namespace: traefik
    spec:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: strict-origin-when-cross-origin
        customResponseHeaders:
          X-Robots-Tag: 'none,noarchive,nosnippet,notranslate,noimageindex'

  # Compression
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: compression
      namespace: traefik
    spec:
      compress: {}
