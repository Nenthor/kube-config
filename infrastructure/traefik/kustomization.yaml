apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: traefik
    repo: https://traefik.github.io/charts
    version: 42.1.3
    releaseName: traefik
    namespace: traefik
    includeCRDs: true
    valuesFile: values.yaml
    apiVersions:
      - monitoring.coreos.com/v1

resources:
  - wildcard-nentwich-dev-cert.yaml
  - wildcard-home-nentwich-dev-cert.yaml
  - wildcard-civtale-de-cert.yaml
  # - wildcard-pillagernews-com-cert.yaml
  - entrypoints.yaml
  - middleware.yaml
  - external-ingress-routes.yaml
  - robots-txt.yaml
  - crowdsec-bouncer-key.yaml
