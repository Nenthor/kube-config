apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: traefik
    repo: https://traefik.github.io/charts
    version: 41.0.1
    releaseName: traefik
    namespace: traefik
    includeCRDs: true
    valuesFile: values.yaml

resources:
  - wildcard-nentwich-dev-cert.yaml
  - immich-ingress-routes.yaml
