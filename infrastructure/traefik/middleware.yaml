# Secure Headers
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: secure-headers
  namespace: traefik
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    frameDeny: true
    contentTypeNosniff: true
    browserXssFilter: true
    referrerPolicy: strict-origin-when-cross-origin
    customResponseHeaders:
      X-Robots-Tag: 'none,noarchive,nosnippet,notranslate,noimageindex'

---
# Compression
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compression
  namespace: traefik
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  compress: {}

---
# CrowdSec
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: crowdsec-bouncer
  namespace: traefik
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  plugin:
    crowdsec-bouncer:
      enabled: true
      crowdsecMode: appsec
      crowdsecLapiHost: '10.77.20.1:8080'
      crowdsecLapiKeyFile: '/etc/traefik/crowdsec/API_KEY'
      crowdsecAppsecEnabled: true
      crowdsecAppsecHost: 'crowdsec-appsec.crowdsec.svc.cluster.local:7422'
      crowdsecAppsecFailureBlock: true
      crowdsecAppsecUnreachableBlock: false
      crowdsecAppsecUnreadableBodyBlock: false

      # Cloudflare ips. Ranges: https://www.cloudflare.com/ips/ (re-check periodically, they do change)
      forwardedHeadersTrustedIPs:
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22
        - 2400:cb00::/32
        - 2606:4700::/32
        - 2803:f800::/32
        - 2405:b500::/32
        - 2405:8100::/32
        - 2a06:98c0::/29
        - 2c0f:f248::/32
