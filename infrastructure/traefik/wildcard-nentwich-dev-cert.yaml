apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-nentwich-dev
  namespace: traefik
spec:
  secretName: wildcard-nentwich-dev-tls
  issuerRef:
    name: letsencrypt-production # Options: letsencrypt-production or letsencrypt-staging
    kind: ClusterIssuer
  dnsNames:
    - 'nentwich.dev'
    - '*.nentwich.dev'
