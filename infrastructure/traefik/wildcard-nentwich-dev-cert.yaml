# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cert-manager.io/certificate_v1.json

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-nentwich-dev
  namespace: traefik
spec:
  secretName: wildcard-nentwich-dev-tls
  issuerRef:
    name: letsencrypt-production # Options: letsencrypt-production or letsencrypt-staging
    kind: ClusterIssuer
  dnsNames:
    - 'nentwich.dev'
    - '*.nentwich.dev'
    - '*.home.nentwich.dev'
