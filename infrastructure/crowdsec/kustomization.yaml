apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: crowdsec
    repo: https://crowdsecurity.github.io/helm-charts
    version: 0.19.4
    releaseName: crowdsec
    namespace: crowdsec
    valuesFile: values.yaml
    includeCRDs: true

resources:
  - appsec-service.yaml
  - externalsecret.yaml
