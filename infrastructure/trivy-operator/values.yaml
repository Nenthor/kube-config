# https://github.com/aquasecurity/trivy-operator/blob/main/deploy/helm/values.yaml

operator:
  builtInTrivyServer: true
  scanJobsConcurrentLimit: 3

  # required for dashboard
  metricsVulnIdEnabled: true

  # One series per finding, shown in the Trivy Operator - Findings dashboard
  metricsExposedSecretInfo: true
  metricsConfigAuditInfo: true
  metricsRbacAssessmentInfo: true
  metricsInfraAssessmentInfo: true
  metricsImageInfo: true
  metricsClusterComplianceInfo: true

serviceMonitor:
  enabled: true
  interval: 2m
  endpointAdditionalProperties:
    metricRelabelings:
      - sourceLabels: [__name__, severity]
        regex: 'trivy_vulnerability_id;(Medium|Low|Unknown)'
        action: drop

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10000
  runAsGroup: 10000
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

trivy:
  storageClassName: local-path
  storageSize: 5Gi

  additionalVulnerabilityReportFields: 'Target,Class,PackagePath,PackageType'

  skipFiles: /etc/ssl/private/ssl-cert-snakeoil.key # Debian ssl-cert placeholder key
