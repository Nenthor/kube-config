apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: infra-critical
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
value: 900000
globalDefault: false
description: 'Cluster stops working without these: ingress, DNS, certs, load balancer.'
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: platform-important
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
value: 500000
globalDefault: false
description: 'Platform services: databases, monitoring, edge filtering. Evicted after infra-critical.'
