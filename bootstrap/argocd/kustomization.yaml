apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

resources:
  - https://github.com/argoproj/argo-cd//manifests/cluster-install?ref=v3.5.6

patches:
  # dex/notifications are unused; argocd-cm, argocd-cmd-params-cm and argocd-secret are owned by initial bootstrap
  - target:
      name: ^argocd-(dex-server.*|notifications-.*|cm|cmd-params-cm|secret)$
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Any
      metadata:
        name: any
