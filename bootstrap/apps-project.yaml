apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-2' # apply this second
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: 'Application Project'
  sourceRepos:
    - '*'
  destinations:
    - namespace: '!kube-system'
      server: '*'
    - namespace: '!argocd'
      server: '*'
    - namespace: '!cnpg-database'
      server: '*'
    - namespace: '!traefik'
      server: '*'
    - namespace: '!cert-manager'
      server: '*'
    - namespace: '!metallb'
      server: '*'
    - namespace: '*'
      server: '*'
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace

  orphanedResources:
    warn: true
