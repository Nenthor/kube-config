# WARNING: on reinstall this will not work because argocd-secret was generated before
# Use: kubectl annotate secret argocd-secret -n argocd sealedsecrets.bitnami.com/managed="true" --overwrite

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: argocd-secret
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '1'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  encryptedData:
    admin.password: 
    admin.passwordMtime: 
    server.secretkey: 
    tls.crt: 
    tls.key: 
    webhook.github.secret: 
  template:
    metadata:
      name: argocd-secret
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '1'
        argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    type: Opaque
