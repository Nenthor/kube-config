apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: argocd-server-transport
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  insecureSkipVerify: true

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-ingress-home
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '2' # runs after infrastructure
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  entryPoints:
    - ws-home
  routes:
    # 1. Standard Web UI Router
    - kind: Rule
      match: Host(`argo.home.nentwich.dev`)
      priority: 10
      services:
        - name: argocd-server
          port: 443
          scheme: https
          serversTransport: argocd-server-transport

    # 2. gRPC CLI Router (requires HTTP/2)
    - kind: Rule
      match: Host(`argo.home.nentwich.dev`) && Header(`Content-Type`, `application/grpc`)
      priority: 11
      services:
        - name: argocd-server
          port: 443
          scheme: https
          serversTransport: argocd-server-transport

  tls: {}

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-ingress-webhook
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '2' # runs after infrastructure
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  entryPoints:
    - ws-nentwich
  routes:
    # github webhook call to argocd
    - kind: Rule
      match: Host(`argo.nentwich.dev`) && PathPrefix(`/api/webhook`)
      services:
        - name: argocd-server
          port: 443
          scheme: https
          serversTransport: argocd-server-transport

  tls: {}
