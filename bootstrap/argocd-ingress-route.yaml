apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '2' # runs after infrastructure
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  entryPoints:
    - websecure
  routes:
    # 1. Standard Web UI Router
    - kind: Rule
      match: Host(`argo.home.nentwich.dev`)
      priority: 10
      services:
        - name: argocd-server
          port: 80

    # 2. gRPC CLI Router (requires HTTP/2)
    - kind: Rule
      match: Host(`argo.home.nentwich.dev`) && Header(`Content-Type`, `application/grpc`)
      priority: 11
      services:
        - name: argocd-server
          port: 80
          scheme: h2c

  tls: {}
