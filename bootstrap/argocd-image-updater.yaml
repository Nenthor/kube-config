apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/argoproj-labs/argocd-image-updater.git
    targetRevision: HEAD
    path: config/default
    kustomize:
      patches:
        - target:
            kind: ConfigMap
            name: argocd-image-updater-config
          patch: |-
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: argocd-image-updater-config
            data:
              # Adds/updates the interval key to 30 seconds
              interval: "30s"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
    automated:
      prune: true
      selfHeal: true
