apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-2' # apply this second
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: 'Default project'
  sourceRepos:
    - '*'
  destinations:
    - namespace: '*'
      server: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  orphanedResources:
    warn: true
    ignore:
      - group: 'metallb.io'
        kind: 'ConfigurationState'
