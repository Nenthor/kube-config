apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infrastructure
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-2' # apply this second
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: 'Infrastructure Project'
  sourceRepos:
    - '*'
  destinations:
    - namespace: '*'
      server: '*'
  clusterResourceWhitelist:
    - group: '' # Namespace
      kind: '*'
    - group: 'admissionregistration.k8s.io' # cert-manager, kps webhooks
      kind: '*'
    - group: 'apiextensions.k8s.io' # CRDs
      kind: '*'
    - group: 'apiregistration.k8s.io'
      kind: '*'
    - group: 'cert-manager.io' # ClusterIssuer
      kind: '*'
    - group: 'networking.k8s.io' # IngressClass
      kind: '*'
    - group: 'rbac.authorization.k8s.io'
      kind: '*'
    - group: 'scheduling.k8s.io'
      kind: '*'
    - group: 'storage.k8s.io'
      kind: '*'
    - group: 'policy'
      kind: '*'
  orphanedResources:
    warn: true
    ignore:
      # --- cert-manager --
      - group: ''
        kind: Secret
        name: cert-manager-webhook-ca

      # --- cnpg ---
      - group: ''
        kind: ConfigMap
        name: cnpg-default-monitoring

      # --- metallb ---
      - group: metallb.io
        kind: ConfigurationState
        name: controller

      # --- traefik ---
      - group: ''
        kind: Secret
        name: wildcard-nentwich-dev-tls

      # --- monitoring ---
      - group: ''
        kind: Secret
        name: kube-prometheus-stack-admission
