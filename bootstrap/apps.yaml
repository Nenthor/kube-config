# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/applicationset_v1alpha1.json

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps-applications
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '2' # runs after infrastructure
spec:
  generators:
    - git:
        repoURL: git@github.com:Nenthor/kube-config.git
        revision: HEAD
        directories:
          - path: apps/*
  template:
    metadata:
      name: 'app-{{path.basename}}'
    spec:
      project: apps
      source:
        repoURL: git@github.com:Nenthor/kube-config.git
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        # automated:
        #   prune: true
        #   selfHeal: true
