apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps-applications
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '2' # runs after infrastructure
spec:
  generators:
    - git:
        repoURL: git@github.com:Nenthor/kube-config.git
        revision: HEAD
        requeueAfterSeconds: 86400
        directories:
          - path: apps/*
  template:
    metadata:
      name: 'app-{{path.basename}}'
      annotations:
        # allowed image to update.
        # It allows:    0.0.1 -> 0.0.2; 0.1.0 -> 0.2.0; 1.1.0 -> 1.2.0
        # It restricts: 1.0.0 -> 2.0.0
        argocd-image-updater.argoproj.io/image-list: 'app-image=git.nentwich.dev/nentwich/{{path.basename}}:0.x || 1.x'

        # check for update
        argocd-image-updater.argoproj.io/app-image.update-strategy: semver

        # write back new version
        argocd-image-updater.argoproj.io/write-back-method: git
        argocd-image-updater.argoproj.io/write-back-target: kustomization
        argocd-image-updater.argoproj.io/git-branch: main
    spec:
      project: apps
      source:
        repoURL: git@github.com:Nenthor/kube-config.git
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        automated:
          prune: true
          selfHeal: true
