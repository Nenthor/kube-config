apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-instance
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Nenthor/kube-config.git
    targetRevision: HEAD
    path: bootstrap/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
    automated:
      prune: false
      selfHeal: true
